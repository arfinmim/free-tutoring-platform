{% extends 'accounts/base.html' %}

{% block content %}

<div class="container mt-4">

    <h2 class="mb-4">Tutors</h2>

    <table class="table table-bordered table-striped">

        <thead class="table-dark">
            <tr>
                <th>Name</th>
                <th>Email</th>
                <th>Subject</th>
                <th>Experience</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody>

        {% for tutor in tutors %}

            <tr>
                <td>{{ tutor.name }}</td>
                <td>{{ tutor.email }}</td>
                <td>{{ tutor.subject }}</td>
                <td>{{ tutor.experience }}</td>

                <td>
                    <a href="{% url 'edit_tutor' tutor.id %}" class="btn btn-warning btn-sm">
                        Edit
                    </a>

                    <a href="{% url 'delete_tutor' tutor.id %}"
                       class="btn btn-danger btn-sm"
                       onclick="return confirm('Are you sure you want to delete this tutor?')">
                        Delete
                    </a>

                    <a href="mailto:{{ tutor.email }}"
                       class="btn btn-primary btn-sm">
                        Contact
                    </a>

                </td>
            </tr>

        {% empty %}

            <tr>
                <td colspan="5" class="text-center">
                    No tutors found.
                </td>
            </tr>

        {% endfor %}

        </tbody>

    </table>

</div>

{% endblock %}
